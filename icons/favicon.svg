<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />

  <!-- Outer Star Pattern / Geometry -->
  <g transform="translate(256, 230)" opacity="0.25">
    <polygon points="0,-130 38,-38 130,0 38,38 0,130 -38,38 -130,0 -38,-38" fill="none" stroke="#f59e0b" stroke-width="4" />
    <polygon points="0,-130 38,-38 130,0 38,38 0,130 -38,38 -130,0 -38,-38" transform="rotate(45)" fill="none" stroke="#f59e0b" stroke-width="4" />
    <circle r="150" fill="none" stroke="#f59e0b" stroke-dasharray="8 6" stroke-width="3" />
  </g>

  <!-- Crescent & Star -->
  <g transform="translate(256, 130)" filter="url(#glow)">
    <path d="M -10 -25 A 30 30 0 1 0 25 15 A 24 24 0 1 1 -10 -25 Z" fill="url(#goldGrad)" />
    <polygon points="28,-18 31,-10 39,-10 33,-5 35,3 28,-1 21,3 23,-5 17,-10 25,-10" fill="#fef08a" />
  </g>

  <!-- Open Book (Kitab) -->
  <g transform="translate(256, 255)">
    <!-- Book Shadow & Base -->
    <ellipse cx="0" cy="90" rx="30" ry="12" fill="#b45309" opacity="0.6" />
    
    <!-- Left Page -->
    <path d="M -8 18 Q -70 -10 -140 0 L -140 90 Q -70 80 -8 108 Z" fill="#ffffff" stroke="#d97706" stroke-width="4" />
    <!-- Right Page -->
    <path d="M 8 18 Q 70 -10 140 0 L 140 90 Q 70 80 8 108 Z" fill="#f8fafc" stroke="#d97706" stroke-width="4" />
    
    <!-- Page text lines left -->
    <path d="M -120 30 Q -65 20 -20 40" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <path d="M -120 50 Q -65 40 -20 60" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <path d="M -120 70 Q -65 60 -20 80" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    
    <!-- Page text lines right -->
    <path d="M 120 30 Q 65 20 20 40" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <path d="M 120 50 Q 65 40 20 60" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <path d="M 120 70 Q 65 60 20 80" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <!-- Center Golden Ribbon Bookmark -->
    <polygon points="-9,10 9,10 9,135 0,120 -9,135" fill="url(#goldGrad)" stroke="#b45309" stroke-width="2" />
  </g>

  <!-- Bottom Brand Text -->
  <g transform="translate(256, 445)">
    <rect x="-115" y="-22" width="230" height="44" rx="22" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="3" text-anchor="middle">KIT-NAF</text>
  </g>
</svg>
